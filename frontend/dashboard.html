<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Ayurvedic Traceability</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .header h1 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .nav-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            margin-top: 15px;
            padding: 8px 20px;
            border: 2px solid #667eea;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            background: #667eea;
            color: white;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .stat-label {
            color: #666;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }

        .chart-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .chart-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        .section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .section h2 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            float: right;
            margin-bottom: 20px;
        }

        .refresh-btn:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .network-status {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            margin-left: 15px;
        }

        .status-active {
            background: #d4edda;
            color: #155724;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Admin Dashboard</h1>
            <p>Monitor blockchain network and traceability analytics</p>
            <span id="networkStatus" class="network-status status-active">✅ Network Active</span>
            <a href="/" class="nav-link">← Back to Home</a>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalBlocks">-</div>
                <div class="stat-label">Total Blocks</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalHerbs">-</div>
                <div class="stat-label">Herbs Tracked</div>
            </div>
        </div>

        <div class="section">
            <button class="refresh-btn" onclick="loadDashboardData()">🔄 Refresh Data</button>
            <h2>🔗 Recent Blockchain Activity</h2>
            <div id="blockchainActivity" class="loading">Loading blockchain data...</div>
        </div>
    </div>

    <script>
        // Load dashboard data when page loads
        loadDashboardData();

        // Auto-refresh every 30 seconds
        setInterval(loadDashboardData, 30000);

        async function loadDashboardData() {
            try {
                const response = await fetch('/api/blockchain/status');
                const data = await response.json();

                if (data.success) {
                    document.getElementById('totalBlocks').textContent = data.totalBlocks || 0;
                    document.getElementById('totalHerbs').textContent = data.totalHerbs || 0;
                    
                    const html = data.recentBlocks.map(block => `
                        <div style="background: #f8f9fa; padding: 15px; margin: 10px 0; border-radius: 8px; border-left: 4px solid #667eea;">
                            <strong>Block #${block.id}</strong> - ${getEventTypeDisplay(block.type)}<br>
                            <small>${new Date(block.timestamp).toLocaleString()}</small>
                        </div>
                    `).join('');

                    document.getElementById('blockchainActivity').innerHTML = html || '<p>No recent activity</p>';
                }
            } catch (error) {
                console.error('Dashboard error:', error);
                document.getElementById('blockchainActivity').innerHTML = '<p>Error loading data</p>';
            }
        }

        function getEventTypeDisplay(type) {
            switch (type) {
                case 'COLLECTION_EVENT': return '🌱 Herb Collection';
                case 'QUALITY_TEST': return '🧪 Quality Test';
                case 'PROCESSING_EVENT': return '⚙️ Processing';
                case 'GENESIS': return '🚀 Genesis Block';
                default: return '📋 Event';
            }
        }
    </script>
</body>
</html>
